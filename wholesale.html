.xl-kicker{letter-spacing:.08em !important;font-size:10.5px !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-card{min-height:116px}
/* Swipe cue above long collection tab rows, and a fade on the row's right edge */
.fx-swipe[data-on="true"]{display:flex !important;align-self:flex-end;align-items:center;gap:6px;margin-bottom:-12px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.fx-swipe[data-on="true"] svg{animation:fxNudge 1.4s ease-in-out infinite}
@keyframes fxNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.fx-swipe[data-on="true"] + [aria-label="Flavor collections"]{-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)}
/* Flavor tabs on one swipeable line */
[aria-label="Flavor collections"]{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px;-webkit-overflow-scrolling:touch}
[aria-label="Flavor collections"]::-webkit-scrollbar{display:none}
[aria-label="Flavor collections"] > button{flex:0 0 auto;white-space:nowrap}
/* Flavor grid: three columns, every flavor shown going down */
.fx-grid{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;grid-auto-flow:row !important;gap:8px !important}

/* Background photos on phones: the tall hero cut, the counter photo as a wide strip */

/* Hero products bigger, their bottom running behind the next section */

/* Wholesale hero on phones: shorter copy block, buttons full width, product art smaller and closer */

.ws-hero > div > div:first-child{gap:14px !important}
.ws-hero h1{font-size:76px !important}
.ws-hero p{font-size:16px !important;line-height:1.5}
.ws-hero > div > div:first-child > div{flex-direction:column;gap:10px !important}
.ws-hero > div > div:first-child > div a{width:100%;box-sizing:border-box;justify-content:center;min-height:52px !important;white-space:nowrap}
.ws-hero .ws-art{zoom:1 !important;height:230px !important;gap:2px !important;margin-top:4px}
.ws-hero .ws-art img:nth-child(1){height:150px !important}
.ws-hero .ws-art img:nth-child(2){height:186px !important}
.ws-hero .ws-art img:nth-child(3){height:200px !important}
.ws-hero .ws-art img:nth-child(4){height:118px !important;margin-left:-10px !important}
/* The lineup on phones: two compact cards per row */
.wl-sec > div{gap:22px !important}
.wl-sec h2{font-size:52px !important}
.wl-sec p{font-size:15px !important}
.wl-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
.wl-card{padding:14px 12px 12px !important;gap:6px !important;border-radius:20px !important}
.wl-kind{font-size:9.5px !important;letter-spacing:.14em !important;padding:4px 8px !important}
.wl-imgbox{height:118px !important;margin:2px 0 !important}
.wl-glow{height:110px !important}
.wl-name{font-size:22px !important}
.wl-line,.wl-stats{display:none !important}
.wl-foot{padding-top:6px !important;font-size:12px !important;gap:6px !important}
.wl-go{font-size:0 !important}
.wl-go span{font-size:16px !important}
.wl-flav{font-size:11px !important;padding:4px 9px !important}
.wl-cta{flex-direction:column;align-items:stretch !important;text-align:center;gap:12px !important;padding:18px !important}
.wl-cta a{justify-content:center;white-space:nowrap}
/* Let's talk on phones: tighter copy, form and product chips */
.wi-wrap{gap:24px !important}
.wi-copy{gap:12px !important}
.wi-copy h2{font-size:52px !important}
.wi-copy p{font-size:15px !important}
.wi-copy a[href^="mailto"]{font-size:17px !important}
.wi-card{padding:20px 16px !important;border-radius:24px !important}
.wi-card form{gap:14px !important}
.wi-card label{font-size:14px !important}
.wi-card .wf-field{height:48px;font-size:15px}
.wi-card textarea.wf-field{height:110px}
.wi-prods{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px !important}
.wi-prods > label{min-height:44px !important;padding:0 12px !important;font-size:14px !important}
.wi-card button[type=submit]{height:54px !important}
/* Why partner with BERI on phones: compact list, check icon left of title and text */
.ws-perks-h{font-size:52px !important}
.ws-perks{grid-template-columns:minmax(0,1fr) !important;gap:10px !important}
.ws-perks > div{display:grid !important;grid-template-columns:40px minmax(0,1fr);column-gap:14px;row-gap:2px !important;align-items:center;padding:16px 18px !important;border-radius:18px !important}
.ws-perks > div > span:nth-child(1){grid-row:1 / span 2;width:40px !important;height:40px !important;border-radius:12px !important;align-self:center}
.ws-perks > div > span:nth-child(2){font-size:17px !important}
.ws-perks > div > span:nth-child(3){grid-column:2;font-size:14px !important;line-height:1.45}
}

@media (max-width:380px){.top-nav{margin:0 6px;padding-left:10px !important}.top-nav .pill-link{padding:0 6px !important;font-size:12.5px}.top-nav .pill-cta{padding:0 11px !important}.top-nav>a:first-child img{height:26px !important}}
/* MOBILE-FIX END */
</style>
