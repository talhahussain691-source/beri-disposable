<style>
@font-face{font-family:"GraffitiBomb Outline";src:url("assets/blob/beacc7fcc275100fd9de2ed4d2b72321.ttf") format("truetype");font-display:swap}
:root{--bg:#F6F3EE;--bg-2:#EDE8DF;--bg-3:#FFFFFF;--line:#DDD6CA;--fg:#111113;--mute:#5E5A53;--gold:#D9C38A;--gold-ink:#7A5F14;--dark:#111113;--display:'Anton',Impact,sans-serif;--display-outline:'GraffitiBomb Outline','Anton',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
.beri-dark{--bg:#111113;--bg-2:#17171A;--bg-3:#1E1E22;--line:#2C2C31;--fg:#F3F0E9;--mute:#B0ACA5;--gold-ink:#D9C38A;background-color:#111113;color:#F3F0E9}
html{scroll-behavior:smooth}
body{margin:0;background:#F6F3EE}
a{color:#111113}a:hover{color:#7A5F14}
.rv-ready [data-reveal]{opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv-ready [data-reveal="up"]{transform:translateY(56px)}
.rv-ready [data-reveal="left"]{transform:translateX(-64px)}
.rv-ready [data-reveal="right"]{transform:translateX(64px)}
.rv-ready [data-reveal="scale"]{transform:scale(.92)}
.rv-ready [data-reveal][data-in]{opacity:1;transform:none}
@keyframes beriMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.beri-marquee{animation:beriMarquee 32s linear infinite}
@keyframes beriSlideLR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.flavor-track{animation:beriSlideLR 90s linear infinite}
.flavor-slider:hover .flavor-track{animation-play-state:paused}
@keyframes beriFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(-6deg)}}
.p-float{animation:beriFloat 6s ease-in-out infinite}
.beri-link{position:relative}
.beri-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#D9C38A;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.beri-link:hover::after,.beri-link.is-current::after{transform:scaleX(1)}
.nav-dd{position:relative}
.nav-menu{position:absolute;top:100%;left:-24px;padding-top:18px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.nav-dd:hover .nav-menu,.nav-dd:focus-within .nav-menu{opacity:1;visibility:visible;transform:none}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#111113;text-decoration:none}
.nav-item:hover{background:#F6F3EE;color:#111113}
.feat-tile img{filter:drop-shadow(0 0 8px rgba(190,200,255,.7))}
.feat-tile[data-kind=badge] img{filter:none}
@media (max-width:699px){.feat-grid{grid-template-columns:minmax(0,1fr) !important}.feat-tile{grid-column:auto !important;min-height:0 !important;padding:18px 20px !important}.feat-tile img{height:56px !important}.feat-tile[data-kind=badge]{padding:0 !important}.feat-tile[data-kind=badge] img{height:auto !important;max-width:270px !important}}
.strip-link{transition:background .3s ease,color .3s ease;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.strip-link:hover{background:rgba(255,255,255,.2)}
@media (max-width:899px){.p-logo{max-width:300px !important}.big-head{font-size:72px !important}.v-title{font-size:56px !important}}
.cf-item{transition:transform .55s var(--ease),opacity .55s var(--ease),box-shadow .55s var(--ease),border-color .55s var(--ease)}
.cf-item:focus-visible,.cf-arrow:focus-visible{outline:3px solid #D9C38A;outline-offset:4px}
@media (max-width:699px){.cf-name{font-size:30px !important}}
.cf-arrow{transition:background .2s ease,border-color .2s ease}
.cf-arrow:hover{background:#111113 !important;border-color:#111113 !important;color:#FFFFFF !important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv-ready [data-reveal]{opacity:1;transform:none;transition:none}.beri-marquee,.p-float,.flavor-track{animation:none}.flavor-slider{overflow-x:auto !important}.cf-item{transition:none}}

/* Explore the lineup: one slim row of product links, the last stop before the footer */
.xl-sec{box-sizing:border-box;max-width:1320px;margin:0 auto;padding:72px 32px 80px;display:flex;flex-direction:column;gap:24px}
.xl-head{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.xl-head-text{display:flex;flex-direction:column;gap:10px}
.xl-title{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;text-transform:uppercase}
.xl-all{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--fg) !important;font-size:14px;font-weight:600;text-decoration:none;opacity:.75;transition:opacity .2s ease}
.xl-all span{display:inline-block;transition:transform .3s var(--ease)}
.xl-all:hover{opacity:1}
.xl-all:hover span{transform:translateX(4px)}
.xl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.xl-card{position:relative;box-sizing:border-box;min-width:0;display:flex;align-items:center;gap:16px;padding:12px 16px 12px 12px;border-radius:22px;background:var(--xl-bg);border:1px solid var(--xl-line);color:var(--fg) !important;text-decoration:none}
.xl-grid .xl-card.xl-card{transition:opacity .9s var(--ease),transform .4s var(--ease),border-color .3s ease,box-shadow .4s var(--ease)}
.xl-grid .xl-card.xl-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 22px 44px -30px var(--c)}
.xl-card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.xl-thumb{flex:none;width:96px;height:96px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 30%,transparent),transparent),color-mix(in srgb,var(--c) 8%,transparent)}
.xl-img{display:block;width:auto;height:82px;max-width:82px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25));transition:transform .5s var(--ease)}
.xl-card:hover .xl-img{transform:translateY(-3px) rotate(-5deg) scale(1.06)}
.xl-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.xl-kicker{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--c)}
.xl-name{font-family:var(--display);font-size:26px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-line{display:block;font-size:13px;line-height:1.45;color:var(--mute)}
.xl-l1,.xl-l2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-go{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--xl-line);color:var(--fg);transition:background .3s ease,border-color .3s ease,color .3s ease,transform .35s var(--ease)}
.xl-card:hover .xl-go{background:var(--c);border-color:var(--c);color:#FFFFFF;transform:rotate(45deg)}
@media (max-width:1180px){.xl-card{gap:14px}.xl-thumb{width:82px;height:82px}.xl-img{height:70px;max-width:70px}.xl-name{font-size:22px}}
@media (max-width:899px){.xl-sec{padding:56px 32px 64px;gap:18px}.xl-head{display:block}.xl-all{position:absolute;right:0;top:-13px;font-size:13px}.xl-title{font-size:32px}.xl-grid{grid-template-columns:minmax(0,1fr);gap:10px}.xl-card{gap:14px;padding:10px 14px 10px 10px;border-radius:18px}.xl-thumb{width:76px;height:76px;border-radius:14px}.xl-img{height:66px;max-width:66px}.xl-name{font-size:22px}.xl-go{width:36px;height:36px}}
.t-crush .xl-title{font-family:var(--tag) !important}
.t-cirql .xl-title{font-weight:600;font-size:48px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-cirql .xl-name{font-weight:600;font-size:24px;letter-spacing:.04em}

/* Header: the Home pill navigation */
.top-nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px}
.top-nav>a:first-child{justify-self:start}
.nav-pill{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 12px;border-radius:999px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 12px 30px rgba(17,17,19,.14),inset 0 1px 0 rgba(255,255,255,.85);font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:500;letter-spacing:0;white-space:nowrap}
.pill-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:none;border-radius:999px;background:none;font:inherit;color:#2A2730;text-decoration:none;cursor:pointer;transition:background .2s ease,color .2s ease}
.pill-link:hover{background:rgba(17,17,19,.08);color:#111113}
.pill-link.is-current{color:#C81E64;font-weight:700}
.pill-cta{display:inline-flex;align-items:center;min-height:44px;margin-left:8px;padding:0 22px;border-radius:999px;background:#111113;color:#FFFFFF !important;font-weight:600;text-decoration:none;transition:background .2s ease}
.pill-cta:hover{background:#C81E64;color:#FFFFFF}
#video-hero{margin-top:-80px}
@media (max-width:899px){#video-hero{margin-top:-68px}.top-nav{grid-template-columns:minmax(0,1fr);row-gap:10px;padding:10px 12px 12px !important}.top-nav>span{display:none}.nav-pill{justify-self:center;font-size:13px;padding:5px 5px 5px 8px}.pill-link{padding:0 8px;gap:4px}.pill-cta{margin-left:4px;padding:0 14px;min-height:40px}}
/* Explore the lineup: theme sizes (the themed heading fonts run wider/narrower) */
.t-crush .xl-sec .xl-title{font-size:60px !important}
.t-cirql .xl-sec .xl-title{font-size:52px !important}
.t-cirql .xl-sec .xl-name{font-size:19px;font-weight:600;letter-spacing:.04em}
.t-crush .xl-sec .xl-kicker,.t-cirql .xl-sec .xl-kicker{color:color-mix(in srgb,var(--c) 55%,#FFFFFF)}
.t-cirql .xl-sec .xl-card{border-color:rgba(212,175,99,.24)}
@media (max-width:1180px){.t-cirql .xl-sec .xl-name{font-size:16px}}
@media (max-width:899px){.t-crush .xl-sec .xl-title{font-size:40px !important}.t-cirql .xl-sec .xl-title{font-size:36px !important}.t-cirql .xl-sec .xl-name{font-size:14px;letter-spacing:.02em}}

/* Flavor showcase: packaging shot of the picked flavor, then every flavor as a card */
.fx-feature{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:40px;min-height:500px;box-sizing:border-box;padding:48px 64px;border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.1)}
.fx-feature::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 75% at 32% 50%,color-mix(in srgb,var(--fx) 38%,transparent),transparent 72%);transition:background .5s ease}
.fx-feature::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;z-index:-1;background:linear-gradient(90deg,transparent,var(--fx),transparent);opacity:.8}
.fx-img{display:block;width:100%;height:420px;object-fit:contain;filter:drop-shadow(0 34px 40px rgba(0,0,0,.6))}
.fx-info{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.fx-badge{padding:7px 14px;border-radius:999px;background:var(--fx-badge);color:#0B0B0D;font-size:12px;font-weight:800;letter-spacing:.16em}
.fx-name{margin:0;font-family:var(--display);font-weight:400;font-size:68px;line-height:.92;text-transform:uppercase;color:#F3F0E9}
.fx-desc{margin:0;max-width:440px;font-size:18px;line-height:1.55;color:#B0ACA5}
.fx-notes{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fx)}
.fx-notes span+span::before{content:"•";margin-right:10px;opacity:.55}
.fx-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.fx-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;padding:18px 12px 16px;border-radius:20px;background:#121214;border:1.5px solid #26262B;color:#F3F0E9;font:inherit;cursor:pointer;transition:transform .3s var(--ease),border-color .3s ease,background .3s ease,box-shadow .3s ease}
.fx-card:hover{transform:translateY(-4px);border-color:var(--fx)}
.fx-card[aria-pressed="true"]{border-color:var(--fx);background:color-mix(in srgb,var(--fx) 12%,#121214);box-shadow:0 18px 40px -20px var(--fx)}
.fx-card:focus-visible{outline:3px solid var(--fx);outline-offset:3px}
.fx-card img{display:block;width:100%;height:160px;object-fit:contain;transition:transform .4s var(--ease)}
.fx-card:hover img{transform:scale(1.05)}
.fx-card span{font-size:14px;font-weight:700;letter-spacing:.04em;line-height:1.25;text-transform:uppercase;text-align:center}
.t-crush .fx-name{font-family:'Anton',Impact,sans-serif}
@media (max-width:1180px){.fx-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:899px){.fx-feature{grid-template-columns:minmax(0,1fr);gap:18px;min-height:0;padding:24px 20px 28px;border-radius:24px}.fx-feature::before{background:radial-gradient(80% 50% at 50% 30%,color-mix(in srgb,var(--fx) 38%,transparent),transparent 72%)}.fx-img{height:270px}.fx-name{font-size:44px}.fx-desc{font-size:16px}.fx-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fx-card{padding:14px 8px 12px;border-radius:16px}.fx-card img{height:120px}.fx-card span{font-size:12px}}
/* E-liquid: flavor section in light */
#flavors.beri-dark{--bg:#FFFFFF;--bg-2:#F6F3EE;--bg-3:#FFFFFF;--line:#E7E2DA;--fg:#111113;--mute:#5E5A53;background-color:#FFFFFF;color:#111113;border-top:1px solid #ECE7DF;border-bottom:1px solid #ECE7DF}
#flavors [aria-label="Flavor collections"] button[aria-pressed="false"]{background:#FFFFFF !important;border-color:#DDD6CA !important;color:#111113 !important}
#flavors [aria-label="Flavor collections"] button[aria-pressed="true"]{background:#111113 !important;border-color:#111113 !important;color:#FFFFFF !important}
#flavors .fx-feature{background:linear-gradient(135deg,#FBFAF7,#F2EFE9);border-color:#E7E2DA}
#flavors .fx-feature::before{background:radial-gradient(55% 75% at 32% 50%,color-mix(in srgb,var(--fx) 32%,transparent),transparent 72%)}
#flavors .fx-img{filter:drop-shadow(0 26px 30px rgba(17,17,19,.22))}
#flavors .fx-name{color:#111113}
#flavors .fx-desc{color:#5E5A53}
#flavors .fx-notes{color:color-mix(in srgb,var(--fx) 55%,#111113)}
#flavors .fx-badge{background:#111113;color:#FFFFFF}
#flavors .fx-card{background:#FFFFFF;border-color:#E7E2DA;color:#111113}
#flavors .fx-card[aria-pressed="true"]{background:color-mix(in srgb,var(--fx) 10%,#FFFFFF);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--fx) 80%,transparent)}
.fx-img[src=""]{visibility:hidden}
#flavors .fx-feature[data-tile="blend"] .fx-img,#flavors .fx-card[data-tile="blend"] img{mix-blend-mode:multiply;filter:none !important}
.fx-card img[src=""]{visibility:hidden}
.fx-card:has(img[src=""])::before{content:"Photo coming soon";position:absolute;left:12px;right:12px;top:18px;height:160px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:repeating-linear-gradient(135deg,#F6F3EE 0 10px,#EFEBE3 10px 20px);color:#8A857C;font-size:12px;font-weight:600;letter-spacing:.08em}
.fx-feature:has(.fx-img[src=""]) .fx-stage::before{content:"Photo coming soon";display:flex;align-items:center;justify-content:center;height:420px;border-radius:24px;background:repeating-linear-gradient(135deg,#F6F3EE 0 14px,#EFEBE3 14px 28px);color:#8A857C;font-size:14px;font-weight:600;letter-spacing:.08em}
.fx-feature:has(.fx-img[src=""]) .fx-img{display:none}
@media (max-width:899px){.fx-card:has(img[src=""])::before{top:14px;height:120px}.fx-feature:has(.fx-img[src=""]) .fx-stage::before{height:270px}}
#flavors .fx-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1180px){#flavors .fx-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:899px){#flavors .fx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:899px){#flavors .fx-feature::before{background:radial-gradient(80% 50% at 50% 30%,color-mix(in srgb,var(--fx) 32%,transparent),transparent 72%)}}
@media (max-width:899px){#product-video{object-position:50% center !important;transform:translateY(-15%)}#product-video + div{background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82) 62%,rgba(0,0,0,.92) 100%) !important}}
/* E-liquid headlines: Play (SIL Open Font License 1.1, Jonas Hecksher / Playtypes). */
@font-face{font-family:"Play";src:url("assets/blob/2122e46089a9f6a0cd36f900fd1648ac.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Play";src:url("assets/blob/3f8e2aeab85a869aec5c37956facb1e6.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--el-head:"Play","Anton",Impact,sans-serif}
.big-head,.v-title,.xl-title,.fx-name,.cf-name,#flavors h3{font-family:var(--el-head) !important;font-weight:700 !important;letter-spacing:-.05em !important}
.big-head{font-size:clamp(44px,7vw,104px) !important;line-height:.95 !important}

/* E-liquid brand-guide accents: brand blue, slogan band with torn edge, stamps, BERI pattern, paint splash, blue-ring pills. */

.beri-dark{--gold-ink:#33A6DA}

/* E-liquid background photos: hero wall, flavor studio, specs liquid, badges wall. */

          ? 'flex: 0 1 520px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 36px; border-radius: 28px; background: rgba(8,10,16,0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px)'
          : 'flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px',
        specCardStyle: base.specVideo
          ? 'flex: 0 1 500px; min-width: 0; margin-left: auto; box-sizing: border-box; border-radius: 28px; background: rgba(10,12,18,0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.14); color: #F3F0E9; --mute: #B0ACA5; padding: 12px 32px'
          : 'flex: 1 1 560px; min-width: 0; border-radius: 28px; background: #FFFFFF; border: 1px solid #DDD6CA; color: #111113; --mute: #5E5A53; padding: 12px 32px',
        hasModes: !!base.modesImg,
        modesImg: base.modesImg || '',
        modesAlt: base.modesAlt || '',
        hasFeatures: !!(base.features && base.features.length),
        featSecStyle: 'max-width: 1320px; margin: 0 auto; padding: 120px 32px ' + (base.packBanner ? '0' : '120px'),
        features: (base.features || []).map((f, i) => {
          const lg = f.size === 'lg';
          if (f.size === 'badge') return {
            kind: 'badge', img: f.img, alt: f.top + ' ' + f.main,
            imgStyle: 'display: block; width: 100%; max-width: 420px; height: auto',
            style: 'grid-column: span 2; display: flex; align-items: center; justify-content: center; transition-delay: ' + (i * 80) + 'ms'
          };
          return {
            kind: f.size,
            img: f.img,
            alt: f.top + ' ' + f.main,
            imgStyle: 'display: block; width: auto; max-width: 100%; height: ' + (lg ? '96px' : '58px'),
            style: 'grid-column: span ' + (lg ? 3 : 2) + '; min-height: ' + (lg ? '190px' : '110px') + '; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: ' + (lg ? '28px' : '16px') + '; padding: ' + (lg ? '32px' : '18px 22px') + '; border-radius: 16px; border: 3.5px solid transparent; background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.07) 0 1px, transparent 1.6px) 0 0 / 8px 8px padding-box, radial-gradient(circle at 70% 70%, rgba(255,255,255,0.045) 0 1px, transparent 1.5px) 0 0 / 13px 13px padding-box, radial-gradient(ellipse 70% 90% at 30% 45%, rgba(110,120,255,0.22), rgba(110,120,255,0) 70%) padding-box, linear-gradient(180deg, #0B1030 0%, #121945 100%) padding-box, linear-gradient(180deg, rgba(110,120,255,0.12) 0%, rgba(110,120,255,0.18) 40%, #4C7DFF 100%) border-box; transition-delay: ' + (i * 80) + 'ms'
          };
        }),
        hasWh: !!WH[PRODUCT_KEY],
        wh: WH[PRODUCT_KEY] || { points: [], stats: [] },
        hasSpecBanner: !!base.specBanner,
        specBanner: base.specBanner || '',
        specBannerAlt: base.specBannerAlt || '',
        hasFlavorBanner: !!base.flavorBanner,
        flavorBanner: base.flavorBanner || '',
        flavorBannerAlt: base.flavorBannerAlt || '',
        hasPackBanner: !!base.packBanner,
        packBanner: base.packBanner || '',
        packBannerAlt: base.packBannerAlt || '',
        packText: base.packText || '',
        noReveal: !hasReveal,
        hasVideo: hasVideo,
        videoMode: base.videoMode || 'scrub',
        video: base.video || '',
        poster: base.poster || '',
        flavorCount: base.flavorTotal || (PRODUCT_KEY === 'CIRQL' ? '[COUNT]' : String(base.flavors.length)),
        hasGroups: fGroups.length > 0,
        hasPack: !!base.pack,
        noPack: !base.pack,
        noGroups: fGroups.length === 0,
        soft: base.soft,
        swipeOn: fGroups.length >= 4 ? 'true' : 'false',
        groupTabs: fGroups.map((g, i) => ({
          name: g.name, count: String(g.items.length), sel: i === fIdx ? 'true' : 'false',
          pick: () => this.setState({ fTab: i, fPick: '' }),
          style: 'min-height: 44px; padding: 0 18px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; border: 1.5px solid ' + (i === fIdx ? base.soft : '#3A3A40') + '; background: ' + (i === fIdx ? base.soft : 'transparent') + '; color: ' + (i === fIdx ? '#111113' : '#F3F0E9')
        })),
        groupItems: fGroup.items.map((x) => {
          const on = x.n === fCur.n;
          const pk = fPack(fGroup.name, x.n);
          return { n: x.n, sel: on ? 'true' : 'false', img: pk[0], c: '--fx: ' + pk[1], tile: pk[2],
            pick: () => {
              this.setState({ fPick: x.n });
              const el = base.pack && document.querySelector('.fx-feature');
              if (el) { const r = el.getBoundingClientRect(); if (r.top < 0 || r.top > window.innerHeight * 0.55) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            },
            style: 'display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 500; border: 1px solid ' + (on ? base.soft : '#2C2C31') + '; background: ' + (on ? '#2A2A30' : '#1E1E22') + '; color: #F3F0E9' };
        }),
        cur: { n: fCur.n, d: fCur.d || '', group: (fGroup.name || '').toUpperCase(), img: fCurPack[0], tile: fCurPack[2], alt: 'BERI ' + base.name + ' ' + fCur.n + ' box and device', fx: '--fx: ' + fCurPack[1] + '; --fx-badge: ' + base.soft,
          noteLine: (fCur.notes || []).map((t) => ({ t: t })),
          notes: (fCur.notes || []).map((t) => ({ t: t, style: 'padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #111113; background: ' + base.soft })) },
        cardStyle: 'position: sticky; top: 140px; display: flex; flex-direction: column; gap: 14px; padding: 32px; border-radius: 24px; background: #17171A; border: 1px solid #2C2C31',
        flavorItems: base.flavors.map((f, i) => ({
          f: f,
          style: 'display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #1E1E22; border: 1px solid #2C2C31; font-size: 16px; font-weight: 500; color: #F3F0E9; transition-delay: ' + Math.min(i * 30, 600) + 'ms'
        })),
        specs: base.specs.map((s, i) => ({
          k: s.k,
          v: s.v,
          rowStyle: 'display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding: 18px 0; font-size: 16px; ' + (i < base.specs.length - 1 ? 'border-bottom: 1px solid ' + (base.specVideo ? 'rgba(255,255,255,0.14)' : '#DDD6CA') : '')
        }))
      }),
      heroStyle: rPinned
        ? 'position: sticky; top: 0; height: 100vh; min-height: 720px; box-sizing: border-box; display: flex; align-items: center; overflow: hidden; padding: 120px 32px 110px; background: ' + revealBg
        : 'position: relative; overflow: hidden; ' + (hasVideo ? 'padding: 110px 32px 90px; ' : 'margin-top: -80px; padding: 150px 32px 90px; ') + 'background: ' + (hasReveal ? revealBg : base.tint),
      badgeStyle: 'align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #FFFFFF; background: ' + base.color + '; padding: 8px 14px; border-radius: 999px',
      logoStyle: 'display: block; width: 100%; max-width: ' + base.logoW + 'px; height: auto',
      glowStyle: 'position: absolute; width: 560px; height: 560px; border-radius: 999px; background: radial-gradient(closest-side, ' + base.soft + '88, ' + base.soft + '00)',
      imgStyle: 'position: relative; display: block; height: ' + base.heroH + 'px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 40px 50px rgba(17,17,19,0.28))',
      countStyle: 'font-family: var(--display); font-size: 64px; line-height: 1; color: ' + base.color,
      marquee: base.marquee.concat(base.marquee).map((t) => ({ t: t })),
      others: order.filter((k) => k !== PRODUCT_KEY).map((k) => {
        const o = products[k];
        const xl = {
          CLIQ: ['Pre-filled pod', 'Up to 50K puffs · 360° crystal tank', '#0F7A42'],
          CRUSH: ['Disposable', 'Up to 50K puffs · 40W Crush Mode', '#C81E64'],
          CIRQL: ['E-hookah', 'Up to 150K puffs · Shisha flavor', '#B23A48'],
          ELIQUID: ['Bottled e-liquid', '30 mL salt nic · 12 flavors', '#B8892B']
        }[k];
        const darkPage = /t-(crush|cirql)/.test('t-' + (base.theme || ''));
        return {
          name: o.name,
          href: o.page,
          color: o.color,
          img: o.img,
          imgAlt: o.imgAlt,
          tagline: o.tagline,
          kind: xl[0],
          line: xl[1],
          l1: xl[1].split(' · ')[0],
          l2: xl[1].split(' · ').slice(1).join(' · '),
          cta: 'View BERI ' + title(o.name) + ' →',
          style: '--c: ' + xl[2] + '; --xl-bg: ' + (darkPage ? 'rgba(255,255,255,0.03)' : '#FFFFFF') + '; --xl-line: ' + (darkPage ? 'rgba(255,255,255,0.1)' : '#E7E2DA')
        };
      }),
      strip: order.map((k) => {
        const o = products[k];
        const current = k === PRODUCT_KEY;
        return {
          label: 'Beri ' + title(o.name),
          href: o.page,
          current: current ? 'page' : 'false',
          style: 'flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 56px; padding: 0 34px; border-radius: 999px; font-size: 17px; font-weight: 700; white-space: nowrap; text-decoration: none; ' + (current ? 'background: #FFFFFF; color: ' + o.color : 'color: #FFFFFF')
        };
      })
    };
  }
}
</script>
<script src="assets/js/beri-runtime.js?v=6"></script>
